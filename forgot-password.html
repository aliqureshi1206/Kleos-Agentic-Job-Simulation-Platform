<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kleos — Reset password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08090A;--surface:#111214;--surface-2:#17181B;--surface-hover:#1C1D20;
  --border:rgba(255,255,255,.08);--border-hover:rgba(255,255,255,.16);
  --text:#F7F8F8;--text-2:#8A8F98;--text-3:#62666D;
  --accent:#D4A853;--accent-hover:#E2BA6C;--accent-dim:rgba(212,168,83,.14);--accent-ink:#15100A;
  --danger:#EB5757;--danger-dim:rgba(235,87,87,.12);
  --sans:'Inter',system-ui,-apple-system,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.4,0,.2,1);--radius:8px;--radius-lg:12px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:
    radial-gradient(ellipse 900px 500px at 50% -12%, rgba(212,168,83,.08), transparent 60%),
    var(--bg);
  color:var(--text);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;
}
button{font-family:inherit;cursor:pointer;border:none}
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.wrap{width:min(360px,90vw);animation:fadeInUp .5s var(--ease)}
.brand{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:32px}
.mark{width:26px;height:26px;border-radius:7px;background:var(--accent);display:flex;align-items:center;justify-content:center;
  color:var(--accent-ink);font-weight:700;font-size:13px}
.wordmark{font-size:16px;font-weight:600;letter-spacing:-.01em}
h1{font-size:20px;font-weight:600;text-align:center;letter-spacing:-.01em;margin-bottom:6px}
.sub{text-align:center;color:var(--text-2);font-size:13px;margin-bottom:28px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;
  transition:border-color .2s var(--ease)}
label{display:block;font-size:12.5px;font-weight:500;color:var(--text-2);margin-bottom:7px}
.field{margin-bottom:16px}
input{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;
  color:var(--text);font-family:inherit;font-size:13.5px;outline:none;transition:all .15s var(--ease)}
input:hover{border-color:var(--border-hover)}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
button.btn{width:100%;padding:11px;border-radius:var(--radius);background:var(--accent);color:var(--accent-ink);
  font-weight:600;font-size:13.5px;transition:all .15s var(--ease);margin-top:4px}
button.btn:hover{background:var(--accent-hover);transform:translateY(-1px);box-shadow:0 6px 16px rgba(212,168,83,.22)}
button.btn:active{transform:translateY(0) scale(.98)}
button.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.err{background:var(--danger-dim);border:1px solid rgba(235,87,87,.3);color:#FF9B9B;font-size:12.5px;
  padding:10px 12px;border-radius:var(--radius);margin-bottom:16px;display:none;animation:fadeInUp .25s var(--ease)}
.note{background:var(--accent-dim);border:1px solid rgba(212,168,83,.3);color:var(--accent);font-size:12.5px;
  padding:10px 12px;border-radius:var(--radius);margin-bottom:16px;display:none;animation:fadeInUp .25s var(--ease)}
.foot{text-align:center;margin-top:24px;font-size:12.5px;color:var(--text-3)}
.foot a{color:var(--accent);text-decoration:none;font-weight:500}
.foot a:hover{text-decoration:underline}
.helptext{font-size:12.5px;color:var(--text-2);margin-bottom:18px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="mark">K</div><div class="wordmark">Kleos</div></div>
  <h1>Reset your password</h1>
  <p class="sub">We'll email you a link.</p>
  <div class="card">
    <div class="note" id="note"></div>
    <div class="err" id="err"></div>
    <div class="helptext" id="helptext">Enter the email on your account. If it exists, we'll send a link to reset your password.</div>
    <form id="form">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" autocomplete="email" required>
      </div>
      <button type="submit" class="btn" id="btn">Send reset link</button>
    </form>
  </div>
  <div class="foot"><a href="/login.html">Back to sign in</a></div>
</div>
<script>
function csrfToken() {
  const m = document.cookie.match(/(?:^|; )kleos\.csrf=([^;]*)/);
  return m ? decodeURIComponent(m[1]) : '';
}

const form = document.getElementById('form');
const err = document.getElementById('err');
const note = document.getElementById('note');
const btn = document.getElementById('btn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    const res = await fetch('/api/auth/request-reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken() },
      body: JSON.stringify({ email: document.getElementById('email').value })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Something went wrong');
    document.getElementById('helptext').style.display = 'none';
    form.style.display = 'none';
    note.textContent = data.message || "If that email has an account, a reset link is on its way. Check your inbox.";
    note.style.display = 'block';
  } catch (e) {
    err.textContent = e.message;
    err.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Send reset link';
  }
});
</script>
</body>
</html>
