<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kleos — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08090A;--panel:#111214;--panel-2:#17181B;--raised:#1C1D20;--line:rgba(255,255,255,.08);
  --ink:#F7F8F8;--ink-2:#8A8F98;--ink-3:#62666D;--bronze:#D4A853;
  --sans:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.4,0,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(ellipse 1100px 650px at 50% -10%, rgba(212,168,83,.07), transparent 60%), var(--bg);
  color:var(--ink);font-family:var(--sans);font-size:14px;min-height:100%;-webkit-font-smoothing:antialiased}
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.topbar{display:flex;align-items:center;padding:14px 26px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;letter-spacing:-.01em}
.mark{width:22px;height:22px;border-radius:6px;background:var(--bronze);display:flex;align-items:center;justify-content:center;
  color:#15100A;font-weight:700;font-size:11px}
.spacer{flex:1}
.badge{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);border:1px solid var(--line);padding:5px 10px;border-radius:7px}
.wrap{max-width:820px;margin:0 auto;padding:56px 24px 90px;animation:fadeInUp .4s var(--ease)}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--bronze);text-align:center}
h1{font-weight:700;font-size:clamp(24px,4vw,34px);text-align:center;line-height:1.2;margin:14px 0 8px;letter-spacing:-.02em}
.sub{text-align:center;color:var(--ink-2);font-size:13.5px;max-width:520px;margin:0 auto 40px}
.grid2{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:16px}
.card-h{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:16px}
.card-h span:last-child{color:var(--bronze);font-size:17px;font-weight:700;letter-spacing:0;text-transform:none}
.dim-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.dim-row:last-child{margin-bottom:0}
.dim-name{width:120px;font-size:12.5px;color:var(--ink-2);flex-shrink:0}
.dim-track{flex:1;height:6px;background:var(--raised);border-radius:3px;overflow:hidden}
.dim-track i{display:block;height:100%;background:var(--bronze);border-radius:3px}
.dim-score{width:34px;text-align:right;font-family:var(--mono);font-size:12.5px;color:var(--ink)}
.narr{font-size:13.5px;color:var(--ink-2);line-height:1.7}
.narr p{margin-bottom:10px}
.narr p:last-child{margin-bottom:0}
.narr strong{color:var(--ink)}
.deed{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;background:var(--panel-2)}
.deed:last-child{margin-bottom:0}
.deed-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.deed-h b{font-size:13.5px;font-weight:600}
.deed-h span{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.deed-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:10.5px;font-family:var(--mono);padding:3px 8px;border-radius:5px;background:var(--raised);color:var(--ink-3)}
.tag.pivot{color:#FF9B9B;background:rgba(235,87,87,.1)}
.empty{color:var(--ink-3);font-size:13px;text-align:center;padding:60px 0}
.foot{text-align:center;margin-top:40px}
.foot a{color:var(--bronze);text-decoration:none;font-size:13px;font-weight:500}
.foot a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><div class="mark">K</div>Kleos</div>
  <div class="spacer"></div>
  <div class="badge">Public portfolio</div>
</div>

<div class="wrap">
  <div id="loading" class="empty">Loading…</div>
  <div id="content" style="display:none">
    <div class="eyebrow" id="eyebrow">Verified run</div>
    <h1 id="who"></h1>
    <p class="sub" id="sub"></p>

    <div class="grid2">
      <div class="card">
        <div class="card-h"><span>Competency matrix</span><span id="overall">—</span></div>
        <div id="dims"></div>
      </div>
      <div class="card">
        <div class="card-h"><span>Manager's closing note</span><span></span></div>
        <div class="narr" id="narrative"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-h"><span>Witnessed deeds</span><span></span></div>
      <div id="deeds"></div>
    </div>

    <div class="foot"><a href="/login.html">Run your own Kleos track →</a></div>
  </div>
  <div id="error" class="empty" style="display:none"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const DIM_LABELS = { technical: 'Technical', scope: 'Scope', communication: 'Communication', speed: 'Speed' };

function renderDims(averages) {
  $('#dims').innerHTML = Object.keys(DIM_LABELS).map(key => {
    const val = averages[key];
    const pct = val === null || val === undefined ? 0 : val;
    return `<div class="dim-row">
      <div class="dim-name">${DIM_LABELS[key]}</div>
      <div class="dim-track"><i style="width:${pct}%"></i></div>
      <div class="dim-score">${val === null || val === undefined ? '—' : val}</div>
    </div>`;
  }).join('');
}

function renderDeeds(tickets) {
  if (!tickets.length) {
    $('#deeds').innerHTML = '<div class="empty" style="padding:20px">No tickets were completed this run.</div>';
    return;
  }
  $('#deeds').innerHTML = tickets.map(t => `
    <div class="deed">
      <div class="deed-h"><b>${t.title}</b><span>${t.id}</span></div>
      <div class="deed-tags">
        <span class="tag">${t.revisions} revision${t.revisions > 1 ? 's' : ''}</span>
        ${t.pivotFired ? '<span class="tag pivot">survived a pivot</span>' : ''}
      </div>
    </div>`).join('');
}

async function boot() {
  const token = new URLSearchParams(location.search).get('token');
  if (!token) {
    $('#loading').style.display = 'none';
    $('#error').style.display = 'block';
    $('#error').textContent = 'Missing portfolio link token.';
    return;
  }
  try {
    const res = await fetch('/api/public/portfolio/' + encodeURIComponent(token));
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'This link is invalid or is no longer shared.');

    $('#who').textContent = data.displayName;
    $('#sub').textContent = `${data.sprint.track.toUpperCase()} · ${data.sprint.duration.toUpperCase()} run · ${data.sprint.totalWorkDays} work days · ${data.report.totalTickets} ticket${data.report.totalTickets === 1 ? '' : 's'} completed`;
    $('#overall').textContent = data.report.overall === null ? '—' : 'Overall ' + data.report.overall;
    renderDims(data.report.averages);
    $('#narrative').innerHTML = data.report.narrative;
    renderDeeds(data.report.tickets);

    $('#loading').style.display = 'none';
    $('#content').style.display = 'block';
  } catch (e) {
    $('#loading').style.display = 'none';
    $('#error').style.display = 'block';
    $('#error').textContent = e.message;
  }
}

boot();
</script>
</body>
</html>
